site_name: ToyQuant-v1 Docs
site_description: This is the web version of all project user manuals.
site_url: https://12mango.github.io/ToyQuant-v1/
repo_url: https://github.com/12mango/ToyQuant-v1

theme:
  name: material
  language: en
  palette:
    # Palette toggle for automatic light/dark mode switching
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - content.code.copy         # Enable one-click copy button for code blocks
    - navigation.expand         # Expand all navigation sub-sections by default
    - navigation.tabs           # Top navigation bar tabs
    - navigation.sections       # Render sections in the left sidebar
    - navigation.top            # Enable "Back to top" button when scrolling down
    - header.autohide           # Auto-hide header when scrolling down

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences         # Enable full support for Mermaid sequence diagrams and code fences