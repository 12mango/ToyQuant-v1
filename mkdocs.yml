site_name: ToyQuant-v1 Docs
site_description: Technical Documentation for ToyQuant-v1 C++20 Trading Engine Demo.
site_url: https://12mango.github.io/ToyQuant-v1/
repo_url: https://github.com/12mango/ToyQuant-v1

theme:
  name: material
  language: en
  palette:
    # Light/Dark mode settings
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - content.code.copy
    - navigation.expand
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - header.autohide

nav:
  - Home: index.md
  - User Guide: USER_GUIDE.md
  - Architecture: ARCHITECTURE.md
  - Scenarios: SCENARIOS.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences